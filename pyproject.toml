[project]
name = "motion-robust-ppg-heart-rate"
version = "0.1.0"
description = "PPG and ACC heart-rate estimation: signal processing, TCNs and ONNX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
ppg-hr = "ppg_hr.cli:main"

[project.optional-dependencies]
ml = ["torch==2.9.1", "onnx>=1.18,<2", "onnxruntime>=1.22,<2", "onnxscript>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ppg_hr"

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
patch = ["subprocess"]
